services:
  web:
    build: .
    ports:
      - "5000:8080"
    environment:
      SECRET_KEY: "${SECRET_KEY:-development-only-change-me}"
      PORT: "8080"
    volumes:
      - game-data:/app/instance
    restart: unless-stopped
    command:
      - sh
      - -c
      - python -m flask --app run.py init-db && exec waitress-serve --listen=0.0.0.0:$${PORT:-8080} run:app

volumes:
  game-data:
